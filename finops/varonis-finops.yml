principles:
  - name: Visibility
    description: Varonis exposes consumption inside the platform UI (events, alerts, classification scans)
      but does not publish a customer-facing usage/cost API. Track license utilization via the customer
      success engagement.
  - name: Allocation
    description: Allocation is contract-level. Internal chargeback typically rides on data-source coverage
      (file shares, M365 tenants, IaaS accounts) negotiated in the order form.
  - name: Optimization
    description: Optimization levers are scope-driven (which data sources / modules are licensed) rather
      than usage-rate. Renewal time is the primary optimization checkpoint.
  - name: Accountability
    description: Accountability sits with the security team that owns the Varonis tenant; finance owns
      the annual subscription line.
