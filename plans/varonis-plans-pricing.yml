description: Varonis publishes no public pricing or self-serve developer plans. The vendor sells the Varonis
  Data Security Platform through enterprise sales engagements, scoped to deployment (cloud / SaaS / on-prem),
  data-source coverage, and modules. There is no developer signup, no published API quota tiers, and no
  free production access.
