notes: 'Pricing is gated. The pricing page redirects to "Get a demo" / "Free risk assessment" lead flows
  with no published tiers. API access is delivered as part of a paid platform subscription. Reconciliation
  to a single Contact Sales plan; revisit if Varonis publishes self-serve API pricing.'
