      name: threatdetection-api-alert-alert-addnote
      description: REST surface for threatdetection-api-alert-alert-AddNote.
      operations:
      - method: POST
        name: addalertnote
        description: Varonis Add Note to Alert
        call: datalert-alerts.addalertnote
        with:
