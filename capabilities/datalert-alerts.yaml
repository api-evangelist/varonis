      key: X-API-Key
      value: '{{env.VARONIS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: datalert-alerts-rest
    port: 8080
    description: REST adapter for Varonis DatAlert API — Alerts. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
