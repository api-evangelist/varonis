        description: Varonis Add Note to Alert
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: threatdetection-api-alert-alert-CloseAlert
      path: /threatdetection/api/alert/alert/CloseAlert
      operations:
      - name: closealert
